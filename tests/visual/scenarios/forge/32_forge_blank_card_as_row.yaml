id: forge_blank_card_as_row
description: "UIX Forge wrapping a blank card as a row renders a uix-forge element containing a uix-forge-blank-card"
view_path: forge-blank-card-as-row

card:
  type: entities
  title: Entities Card
  entities:
    - type: custom:uix-forge
      forge:
        mold: card_as_row
        sparks:
          - type: overlay-icon
            icon: mdi:shimmer
            icon_color: red
            icon_position:
              left: 10px
              top: 8px
        uix:
          style: |
            :host {
              --uix-forge-blank-card-height: 40px;
            }

assertions:
  - type: element_present
    root: "uix-forge-blank-card"
    selector: "ha-card.clear"

  - type: snapshot
    name: "34_forge_blank_card_as_row"
    threshold: 0.02
