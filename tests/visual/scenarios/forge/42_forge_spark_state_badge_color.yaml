id: forge_spark_state_badge_color
description: "UIX Forge wrapping entities row shows state_color and color correctly on the state-badge"
view_path: forge-spark-state-badge-color

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631
  - type: ha_service
    domain: switch
    service: turn_on
    data:
      entity_id: switch.decorative_lights

card:
  type: entities
  entities:
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: state-badge
            before: $ hui-generic-entity-row $ state-badge:not([data-uix-forge-state-badge-id])
            entity: switch.decorative_lights
            state_color: true
      element:
        entity: light.bed_light
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: state-badge
            before: $ hui-generic-entity-row $ state-badge:not([data-uix-forge-state-badge-id])
            entity: switch.decorative_lights
            state_color: false
      element:
        entity: light.bed_light
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: state-badge
            before: $ hui-generic-entity-row $ state-badge:not([data-uix-forge-state-badge-id])
            entity: switch.decorative_lights
            color: state
      element:
        entity: light.bed_light
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: state-badge
            before: $ hui-generic-entity-row $ state-badge:not([data-uix-forge-state-badge-id])
            entity: switch.decorative_lights
            color: none
      element:
        entity: light.bed_light
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: state-badge
            before: $ hui-generic-entity-row $ state-badge:not([data-uix-forge-state-badge-id])
            entity: switch.decorative_lights
            color: red
      element:
        entity: light.bed_light

assertions:
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(1) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: stateColor
    expected: undefined
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(2) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: stateColor
    expected: undefined
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(1) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: color
    expected: state
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(2) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: color
    expected: none
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(3) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: color
    expected: state
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(4) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: color
    expected: none
  - type: object_property_text_equals
    root:
      - "#states div:nth-of-type(5) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
    selector: state-badge[data-uix-forge-state-badge-id]
    property: color
    expected: red
  - type: css_property
    root:
      - "#states div:nth-of-type(1) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
      - state-badge[data-uix-forge-state-badge-id]
    selector: ha-state-icon
    property: color
    expected: rgb(255, 193, 7)
  - type: css_property
    root:
      - "#states div:nth-of-type(2) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
      - state-badge[data-uix-forge-state-badge-id]
    selector: ha-state-icon
    property: color
    expected: rgb(68, 115, 158)
  - type: css_property
    root:
      - "#states div:nth-of-type(3) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
      - state-badge[data-uix-forge-state-badge-id]
    selector: ha-state-icon
    property: color
    expected: rgb(255, 193, 7)
  - type: css_property
    root:
      - "#states div:nth-of-type(4) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
      - state-badge[data-uix-forge-state-badge-id]
    selector: ha-state-icon
    property: color
    expected: rgb(68, 115, 158)
  - type: css_property
    root:
      - "#states div:nth-of-type(5) uix-forge"
      - hui-toggle-entity-row
      - hui-generic-entity-row
      - state-badge[data-uix-forge-state-badge-id]
    selector: ha-state-icon
    property: color
    expected: "rgb(244, 67, 54)" # this is HA '--red-color'
  - type: snapshot
    name: "43_forge_spark_state_badge_color"
    threshold: 0.02
