id: forge_spark_map_entity_filter_show_all
description: "Map spark in entity_filter mode works with show_all: true"
view_path: forge-spark-map-entity-filter-show-all

setup:
  - type: webhook
    webhook_id: uix_device_tracker_uix_test_person
    payload:
      latitude: 51.5074
      longitude: -0.1278
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_uix_test_person_slider
    payload:
      latitude: 51.5220
      longitude: -0.1280
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_uix_tracker_one
    payload:
      latitude: 51.5200
      longitude: -0.1300
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_uix_tracker_two
    payload:
      latitude: 51.5210
      longitude: -0.1295
      resolution: 1
  - type: wait
    ms: 2000

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: map
        entity_filter: true
  element:
    type: map
    show_all: true

interactions:
  - type: wait
    ms: 3000
  - type: click
    root:
      - hui-map-card
      - ha-map
    selector: ha-button
    settle_ms: 2000

assertions:
  - type: element_present
    root:
      - hui-map-card
      - ha-map
    selector: div.uix-map-entity-filter-control

  - type: element_present
    root:
      - hui-map-card
      - ha-map
    selector: ha-dropdown

  # The "Show All" master toggle checkbox should exist
  - type: element_present
    root:
      - hui-map-card
      - ha-map
    selector: "ha-dropdown-item[data-show-all-toggle]"

  - type: text_equals
    root:
      - hui-map-card
      - ha-map
    selector: "ha-dropdown-item[data-show-all-toggle]"
    expected: "Show All"

  - type: snapshot
    name: "30_forge_spark_map_entity_filter_show_all"
    threshold: 0.05