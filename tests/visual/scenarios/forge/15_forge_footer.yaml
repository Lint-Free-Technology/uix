id: forge_footer
description: "UIX Forge footer refreshes configured position and width template values"
view_path: forge-footer

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 181
      color_temp_kelvin: 2631

card:
  type: "custom:uix-forge"
  forge:
    mold: footer
    bottom: "{{ '100px' if is_state('light.bed_light', 'on') else '200px' }}"
    max_width: "{{ 400 if is_state('light.bed_light', 'on') else 300 }}"
  element:
    type: tile
    entity: "light.bed_light"

interactions:
  - type: ha_service
    domain: light
    service: turn_off
    entity_id: light.bed_light
  - type: wait
    ms: 2000

assertions:
  - type: element_present
    root: "uix-forge"
    selector: "hui-view-footer"

  - type: css_property
    root: "uix-forge"
    selector: "hui-view-footer"
    property: position
    expected: "fixed"

  - type: css_property
    root: "uix-forge"
    selector: "hui-view-footer"
    property: bottom
    expected: "200px"

  - type: css_property
    root: "uix-forge"
    selector: "hui-view-footer"
    property: maxWidth
    expected: "300px"
