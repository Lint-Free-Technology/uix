id: forge_spark_more_info_show_child_view
description: "More-info spark handles show-child-view event and propagates it to ha-more-info-dialog"
theme: uix-more-info-theme
view_path: forge-spark-more-info-show-child-view

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: more-info
        entity: vacuum.demo_vacuum_0_ground_floor

interactions:
  - type: click
    root: more-info-vacuum
    selector: button.clean-areas-button
    settle_ms: 500

assertions:
  - type: element_present
    root: ha-more-info-dialog
    selector: ha-more-info-view-vacuum-clean-areas
  - type: snapshot
    name: 39_forge_spark_more_info_show_child_view.png
    padding: 16
    threshold: 0.02
