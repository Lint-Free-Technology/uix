id: forge_spark_lock_badge
description: "UIX Forge lock spark blocks a Home Assistant badge"
view_path: forge-spark-lock-badge

dashboard:
  views:
    - type: sections
      title: Forge lock badge
      badges:
        - type: custom:uix-forge
          forge:
            mold: badge
            sparks:
              - type: lock
                code_dialog:
                  title: Enter PIN
                locks:
                  - code: 1234
                    admins: true
          element:
            type: entity
            entity: input_boolean.test_boolean

interactions:
  - type: snapshot
    name: "75_forge_spark_lock_badge"
    root: uix-forge
    padding: "12 36"
    threshold: 0.02
  - type: click
    root:
      - uix-forge
      - hui-badge hui-entity-badge
      - ha-badge
    selector: ".badge > div[data-uix-forge-lock-id]"
    settle_ms: 500
  - type: snapshot
    name: "75b_forge_spark_lock_badge_dialog"
    threshold: 0.02

assertions:
  - type: element_present
    root:
      - uix-forge
      - hui-badge hui-entity-badge
      - ha-badge
    selector: ".badge > div[data-uix-forge-lock-id]"
  - type: css_property
    root:
      - uix-forge
      - hui-badge hui-entity-badge
      - ha-badge
    selector: "div[data-uix-forge-lock-id] > ha-icon"
    property: left
    expected: "24px"
  - type: element_present
    root: dialog-enter-code
    selector: "ha-adaptive-dialog[open]"
