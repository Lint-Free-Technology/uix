id: forge_spark_map_entity_filter
description: "Map spark in entity_filter mode renders an interactive dropdown checklist"
view_path: forge-spark-map-entity-filter

setup:
  - type: webhook
    webhook_id: uix_device_tracker_uix_tracker_one
    payload:
      latitude: 51.5200
      longitude: -0.1300
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_uix_tracker_two
    payload:
      latitude: 51.5210
      longitude: -0.1295
      resolution: 1
  - type: wait
    ms: 2000

card:
  type: "custom:uix-forge"
  forge:
    mold: card
    sparks:
      - type: map
        entity_filter: true
  element:
    type: map
    entities:
      - entity: device_tracker.uix_tracker_one
      - entity: device_tracker.uix_tracker_two

interactions:
  - type: wait
    ms: 1000
  - type: click
    root: ["hui-map-card", "ha-map"]
    selector: "ha-button"
    settle_ms: 2000

assertions:
  - type: element_present
    root: ["hui-map-card", "ha-map"]
    selector: "div.uix-map-entity-filter-control"

  - type: element_present
    root: ["hui-map-card", "ha-map"]
    selector: "ha-dropdown"

  - type: element_present
    root: ["hui-map-card", "ha-map"]
    selector: "ha-dropdown-item"

  - type: snapshot
    name: "29_forge_spark_map_entity_filter"
    threshold: 0.05
