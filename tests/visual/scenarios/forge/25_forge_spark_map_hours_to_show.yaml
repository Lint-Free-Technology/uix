id: forge_spark_map_hours_to_show
description: "Map spark in hours_to_show mode renders an interactive slider control"
view_path: forge-spark-map-hours-to-show

setup:
  - type: clear_demo_geo_locations
  - type: mock_history
    entity_id: device_tracker.uix_test_person_slider
    points:
      - lat: 51.5202
        lng: -0.16963
        age_hours: 14
      - lat: 51.5310
        lng: -0.12350
        age_hours: 12
      - lat: 51.5262
        lng: -0.08785
        age_hours: 3
      - lat: 51.5187
        lng: -0.11174
        age_hours: 2
      - lat: 51.5220
        lng: -0.1280
        age_hours: 1
  - type: webhook
    webhook_id: uix_device_tracker_uix_test_person_slider
    payload:
      latitude: 51.5220
      longitude: -0.1280
      resolution: 1
  - type: wait
    ms: 2000

card:
  type: "custom:uix-forge"
  forge:
    mold: card
    sparks:
      - type: map
        hours_to_show:
          min: 0
          max: 48
          step: 2
  element:
    type: map
    hours_to_show: 3
    default_zoom: 13
    entities:
      - entity: device_tracker.uix_test_person_slider

interactions:
  - type: wait
    ms: 1000
  - type: click
    root: ["hui-map-card", "ha-map"]
    selector: "ha-slider"
    settle_ms: 2000

assertions:
  - type: element_present
    root: ["hui-map-card", "ha-map"]
    selector: "div.uix-map-slider-control"

  - type: element_present
    root: ["hui-map-card", "ha-map"]
    selector: "ha-slider"

  - type: text_equals
    root: ["hui-map-card", "ha-map"]
    selector: ".uix-map-slider-control span"
    expected: "24h"

  - type: snapshot
    name: "28_forge_spark_map_hours_to_show"
    threshold: 0.01
