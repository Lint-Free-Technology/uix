id: view_theme_uix_styles_more_info
description: "More info styles uix theme is resolved when more info dialog called on an entity with a view theme set via alias"

theme: uix-global-blue

view_path: view-theme-uix-styles

dashboard:
  views:
    - type: sections
      sections:
        - type: grid
          cards:
            - type: tile
              entity: light.bed_light
      theme: uix-local-orange-alias
      title: Themed View
      path: view-theme-uix-styles

interactions:
  - type: click
    selector: "hui-tile-card"
    target: "ha-card"
    settle_ms: 500

assertions:
  - type: css_variable
    root: "ha-more-info-dialog"
    selector: "ha-more-info-info"
    property: "--uix-test-more-info-theme"
    expected: "applied"
  - type: object_property_text_equals
    root: "ha-more-info-dialog"
    selector: "uix-node"
    property: "theme"
    expected: "uix-local-orange-alias"
  - type: object_property_text_equals
    root: "ha-more-info-dialog"
    selector: "uix-node"
    property: "_themeAppliedByUix"
    expected: "true"