id: icon_color_for_entity
description: "Icon and color styling for an entity can be set via a theme variable and macro"
view_path: icon-color-for-entity

theme: uix-icon-for-entity-theme

cards:
  - type: heading
    icon: mdi:border-none-variant
    heading: Weather
    heading_style: title
    uix:
      style: |
        ha-icon {
          --uix-icon: mdi:weather-sunny;
          --uix-icon-color: orange;
        }
  - type: tile
    entity: sensor.outside_temperature
  - type: tile
    entity: sensor.outside_temperature
    uix:
      style: |
        ha-tile-icon {
          --uix-icon: mdi:thermometer-lines;
          --uix-icon-color: red;
        }
  - type: tile
    entity: sensor.outside_temperature
    uix:
      style: |
        ha-tile-icon {
          --uix-icon-for-sensor_outside_temperature: mdi:thermometer-alert;
          --uix-icon-color-for-sensor_outside_temperature: purple;
        }

interactions:
  - type: wait
    ms: 250

assertions:
  - type: object_property_text_equals
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(1) hui-heading-card"
    selector: "ha-icon"
    property: "icon"
    expected: "mdi:weather-sunny"
  - type: css_property
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(1) hui-heading-card"
    selector: "ha-icon"
    property: "color"
    expected: "rgb(255, 165, 0)"
  - type: object_property_text_equals
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(2) hui-tile-card"
    selector: "ha-state-icon"
    property: "icon"
    expected: "mdi:thermometer-bluetooth"
  - type: css_property
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(2) hui-tile-card"
    selector: "ha-state-icon"
    property: "color"
    expected: "rgb(0, 128, 0)"
  - type: object_property_text_equals
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(3) hui-tile-card"
    selector: "ha-state-icon"
    property: "icon"
    expected: "mdi:thermometer-lines"
  - type: css_property
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(3) hui-tile-card"
    selector: "ha-state-icon"
    property: "color"
    expected: "rgb(255, 0, 0)"
  - type: object_property_text_equals
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(4) hui-tile-card"
    selector: "ha-state-icon"
    property: "icon"
    expected: "mdi:thermometer-alert"
  - type: css_property
    root: 
      - "hui-grid-section"
      - "div.card:nth-of-type(4) hui-tile-card"
    selector: "ha-state-icon"
    property: "color"
    expected: "rgb(128, 0, 128)"
  - type: snapshot
    name: "49_icon_color_for_entity"
    threshold: 0.01
