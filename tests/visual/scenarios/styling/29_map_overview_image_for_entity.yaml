id: map_overview_image_for_entity
description: "UIX styles image for entity on map overview"
view_path: map_overview_for_entity

theme: uix-image-for-entity-theme

card:
  type: shortcut
  tap_action:
    action: navigate
    navigation_path: /map
  vertical: false

interactions:
  - type: click
    root: hui-shortcut-card
    selector: ha-card
    settle_ms: 500
  - type: snapshot
    name: "67a_map_overview_image_for_entity_override_1"
    root: hui-map-overview
    threshold: 0.02
  - type: set_theme_file
    theme: uix-image-for-entity-theme
    values:
      uix-macros-yaml: |
        image_person_james_bond:
          template: >
            {% if is_state('person.james_bond_007', 'unknown') %}
              --uix-image-for-person_james_bond_007: /local/media/question_mark_transparent_cropped.jpg;
            {% else %}
              --uix-image-for-person_james_bond_007: /local/media/daniel_craig_cropped.jpg;
            {% endif %}
  - type: ha_service
    domain: frontend
    service: reload_themes
  - type: wait
    ms: 1200
  - type: snapshot
    name: "67b_map_overview_image_for_entity_override_2"
    root: hui-map-overview
    threshold: 0.02
  - type: set_theme_file
    theme: uix-image-for-entity-theme
    values:
      uix-macros-yaml: |
        image_person_james_bond:
          template: >
            {{ "" }}
  - type: ha_service
    domain: frontend
    service: reload_themes
  - type: wait
    ms: 1200

assertions:
  - type: snapshot
    name: "67c_map_overview_image_for_entity_final"
    root: hui-map-overview
    threshold: 0.02

teardown:
  - type: set_theme_file
    theme: uix-image-for-entity-theme
    values:
      uix-macros-yaml: |
        image_person_james_bond:
          template: >
            {% if is_state('person.james_bond_007', 'unknown') %}
              --uix-image-for-person_james_bond_007: /local/media/question_mark_cropped.jpg;
            {% else %}
              --uix-image-for-person_james_bond_007: /local/media/daniel_craig_cropped.jpg;
            {% endif %}
  - type: ha_service
    domain: frontend
    service: reload_themes