id: extra_popover_action
description: "UIX popover action on a tile card"
view_path: extra-popover-action

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 181
      color_temp_kelvin: 2631

card:
  type: tile
  entity: light.bed_light
  tap_action:
    action: fire-dom-event
    uix:
      action: popover
      data:
        title: Bed light
        subtitle: Quick controls
        subtitle_position: above
        width: small
        dismissible: false
        card:
          type: tile
          entity: light.bed_light
        icons:
          - icon: mdi:cog
            label: Settings
            tap_action:
              action: none
        buttons:
          secondary:
            label: Cancel
          primary:
            label: Toggle
            entity: light.bed_light
            tap_action:
              action: toggle
        uix:
          style: |
            .uix-popover-card {
              --ha-card-border-width: 0px;
            }

interactions:
  - type: click
    root: hui-tile-card
    selector: ha-card
    settle_ms: 500

assertions:
  - type: element_present
    root: home-assistant
    selector: ha-adaptive-popover[open]
  - type: snapshot
    name: 69_extra_popover_action
    threshold: 0.01
