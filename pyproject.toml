[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uix"
version = "7.7.1"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "ha-testcontainer[test]>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
