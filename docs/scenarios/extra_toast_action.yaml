id: doc_extra_toast_action
description: "UIX toast action on a tile card"
view_path: doc-extra-toast-action

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 181
      color_temp_kelvin: 2631

card:
  type: tile
  entity: light.bed_light
  tap_action:
    action: fire-dom-event
    uix:
      action: toast
      data:
        message: "Bed Light"
        duration: 10000
        dismissable: true
        bottomOffset: 550
        action:
          text:
            translationKey: ui.dialogs.more_info_control.light.toggle
          tap_action:
            action: perform-action
            perform_action: light.toggle
            target:
              entity_id: light.bed_light
  
doc_animation:
  output: docs/source/assets/page-assets/extras/extra-toast-action.gif
  root: hui-tile-card
  padding: 16 100 150 100
  interval_ms: 66
  threshold: 0.02
  cursor: pointer
  segments:
    - frames: 7   # ~0.5 s
    - interactions:
        - type: hover
          root: hui-tile-card
          selector: ha-card
          settle_ms: 0
      frames: 14   # ~1 s
    - interactions:
        - type: click
          root: hui-tile-card
          selector: ha-card
          settle_ms: 0
      frames: 3   # ~0.2 s
      click_circle: true
    - frames: 7   # ~0.5 s
    - interactions:
        - type: hover
          root: notification-manager
          selector: ha-button
          settle_ms: 0
      frames: 14   # ~1 s
    - interactions:
        - type: click
          root: notification-manager
          selector: ha-button
          settle_ms: 0
      frames: 3   # ~0.2 s
      click_circle: true
    - interactions:
        - type: hover_away
      frames: 14   # ~0.5 s
    - interactions:
        - type: hover
          root: hui-tile-card
          selector: ha-card
          settle_ms: 0
      frames: 14   # ~1 s
    - interactions:
        - type: click
          root: hui-tile-card
          selector: ha-card
          settle_ms: 0
      frames: 3   # ~0.2 s
      click_circle: true
    - frames: 7   # ~0.5 s
    - interactions:
        - type: hover
          root: notification-manager
          selector: ha-button
          settle_ms: 0
      frames: 14   # ~1 s
    - interactions:
        - type: click
          root: notification-manager
          selector: ha-button
          settle_ms: 0
      frames: 3   # ~0.2 s
      click_circle: true
    - interactions:
        - type: hover_away
      frames: 14   # ~0.5 s