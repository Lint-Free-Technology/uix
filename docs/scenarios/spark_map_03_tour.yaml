id: doc_forge_map_spark_tour
description: "Doc image: UIX Forge map spark tour (map.md)"
view_path: doc-forge-map-spark-tour

setup:
  - type: webhook
    webhook_id: uix_device_tracker_phone
    payload:
      latitude: 51.5074
      longitude: -0.1278
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_tablet
    payload:
      latitude: 51.752985
      longitude: -1.257988
      resolution: 1

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: map
        tour: true
  element:
    type: map
    entities:
      - device_tracker.phone
      - device_tracker.tablet

assertions: []

doc_animation:
  output: docs/source/assets/page-assets/forge/sparks/map-tour.mp4
  root: uix-forge
  padding: 16
  interval_ms: 66
  threshold: 1
  segments:
    - frames:  380  # ~20 s