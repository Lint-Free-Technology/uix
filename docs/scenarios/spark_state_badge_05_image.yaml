id: doc_spark_state_badge_image
description: "Doc image: state-badge spark with image (state-badge.md)"
view_path: doc-spark-state-badge-image

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 181
      color_temp_kelvin: 2631
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.ceiling_lights
      brightness: 255
      color_temp_kelvin: 2631

card:
  type: entities
  entities:
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: state-badge
            after: $ hui-generic-entity-row $ state-badge
            entity: light.ceiling_lights
            override_image: /local/media/daniel_craig_cropped.jpg
            state_color: false
      element:
        entity: light.bed_light

assertions: []

doc_image:
  output: docs/source/assets/page-assets/forge/sparks/state-badge-image.png
  root: hui-entities-card
  padding: 16
  threshold: 0.02