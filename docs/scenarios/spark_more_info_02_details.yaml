id: doc_spark_more_info_details
description: "Doc image: UIX Forge more-info spark with details (more-info.md)"
view_path: doc-spark-more-info-details

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: more-info
        entity: weather.demo_weather_south
        details: true

assertions: []

doc_animation:
  output: docs/source/assets/page-assets/forge/sparks/more-info-details.gif
  root: uix-forge
  padding: 16
  interval_ms: 66
  threshold: 1 # Weather always changing
  cursor: pointer
  segments:
    - frames: 7   # ~0.5 s
    - interactions:
        - type: hover
          root: uix-forge-blank-card
          selector: ha-icon-button.uix-forge-more-info-details-toggle
          settle_ms: 100
      frames: 7   # ~0.5 s
    - interactions:
        - type: click
          root: uix-forge-blank-card
          selector: ha-icon-button.uix-forge-more-info-details-toggle
          settle_ms: 50
      frames: 3   # ~0.2 s
      click_circle: true
    - frames: 14   # ~1 s
    - interactions:
        - type: hover
          root: uix-forge-blank-card
          selector: ha-icon-button.uix-forge-more-info-yaml-toggle
          settle_ms: 100
      frames: 7   # ~0.5 s
    - interactions:
        - type: click
          root: uix-forge-blank-card
          selector: ha-icon-button.uix-forge-more-info-yaml-toggle
          settle_ms: 50
      frames: 3   # ~0.2 s
      click_circle: true
    - frames: 14   # ~1 s
    - interactions:
        - type: hover
          root: uix-forge-blank-card
          selector: ha-icon-button.uix-forge-more-info-details-toggle
          settle_ms: 100
      frames: 7   # ~0.5 s
    - interactions:
        - type: click
          root: uix-forge-blank-card
          selector: ha-icon-button.uix-forge-more-info-details-toggle
          settle_ms: 50
      frames: 3   # ~0.2 s
      click_circle: true
    - frames: 14   # ~1 s
    - interactions:
        - type: hover_away
      frames: 7   # ~0.5 s