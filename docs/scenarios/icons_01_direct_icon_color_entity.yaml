id: doc_icons_direct_icon_color_entity
description: "Doc image: direct styling of icon color on icons (icons.md)"
view_path: doc-icons-direct-icon-color-entity

setup:
  - type: ha_service
    domain: climate
    service: set_hvac_mode
    data:
      entity_id: climate.hvac
      hvac_mode: auto

cards:
  - type: heading
    heading: House Temperatures
    heading_style: title
    icon: mdi:checkbox-blank-outline
    uix:
      style: |
        ha-icon {
          --uix-icon: {{ 'mdi:hvac' if is_state('climate.hvac', 'auto') else 'mdi:hvac-off' }};
          --uix-icon-color: {{ 'var(--state-climate-auto-color)' if is_state('climate.hvac', 'auto') else 'var(--state-inactive-color)' }};
        }
  - type: tile
    entity: sensor.sauna_temperature
    uix:
      style: |
        ha-tile-icon {
          {%- set entityString = config.entity.replace('.','_') -%}
          --uix-icon-for-{{ entityString }}: mdi:thermometer-bluetooth;
          --uix-icon-color-for-{{ entityString }}:
          {%- set raw = states(config.entity) -%}
          {%- if raw in ['unknown', 'unavailable', 'none'] -%} gray;
          {%- else -%}
          {%- set state = raw|float(-5) -%}
          {%- if state < 5 -%} dodgerblue
          {%- elif state < 10 -%} lightblue
          {%- elif state < 15 -%} turquoise
          {%- elif state < 20 -%} green
          {%- elif state < 25 -%} darkgreen
          {%- elif state < 30 -%} orange
          {%- elif state < 35 -%} crimson
          {%- else -%} firebrick
          {%- endif -%};
          {%- endif -%}
        }
  - type: tile
    entity: sensor.basement_temperature
    uix:
      style: |
        ha-tile-icon {
          {%- set entityString = config.entity.replace('.','_') -%}
          --uix-icon-for-{{ entityString }}: mdi:thermometer-bluetooth;
          --uix-icon-color-for-{{ entityString }}:
          {%- set raw = states(config.entity) -%}
          {%- if raw in ['unknown', 'unavailable', 'none'] -%} gray;
          {%- else -%}
          {%- set state = raw|float(-5) -%}
          {%- if state < 5 -%} dodgerblue
          {%- elif state < 10 -%} lightblue
          {%- elif state < 15 -%} turquoise
          {%- elif state < 20 -%} green
          {%- elif state < 25 -%} darkgreen
          {%- elif state < 30 -%} orange
          {%- elif state < 35 -%} crimson
          {%- else -%} firebrick
          {%- endif -%};
          {%- endif -%}
        }
  - type: tile
    entity: sensor.kitchen_temperature
    uix:
      style: |
        ha-tile-icon {
          {%- set entityString = config.entity.replace('.','_') -%}
          --uix-icon-for-{{ entityString }}: mdi:thermometer-bluetooth;
          --uix-icon-color-for-{{ entityString }}:
          {%- set raw = states(config.entity) -%}
          {%- if raw in ['unknown', 'unavailable', 'none'] -%} gray;
          {%- else -%}
          {%- set state = raw|float(-5) -%}
          {%- if state < 5 -%} dodgerblue
          {%- elif state < 10 -%} lightblue
          {%- elif state < 15 -%} turquoise
          {%- elif state < 20 -%} green
          {%- elif state < 25 -%} darkgreen
          {%- elif state < 30 -%} orange
          {%- elif state < 35 -%} crimson
          {%- else -%} firebrick
          {%- endif -%};
          {%- endif -%}
        }
  - type: tile
    entity: sensor.attic_temperature
    uix:
      style: |
        ha-tile-icon {
          {%- set entityString = config.entity.replace('.','_') -%}
          --uix-icon-for-{{ entityString }}: mdi:thermometer-bluetooth;
          --uix-icon-color-for-{{ entityString }}:
          {%- set raw = states(config.entity) -%}
          {%- if raw in ['unknown', 'unavailable', 'none'] -%} gray;
          {%- else -%}
          {%- set state = raw|float(-5) -%}
          {%- if state < 5 -%} dodgerblue
          {%- elif state < 10 -%} lightblue
          {%- elif state < 15 -%} turquoise
          {%- elif state < 20 -%} green
          {%- elif state < 25 -%} darkgreen
          {%- elif state < 30 -%} orange
          {%- elif state < 35 -%} crimson
          {%- else -%} firebrick
          {%- endif -%};
          {%- endif -%}
        }
  - type: tile
    entity: climate.hvac
    grid_options:
      columns: 12
      rows: 1
    uix:
      style: |
        ha-state-icon {
          --uix-icon: {{ 'mdi:hvac' if is_state('climate.hvac', 'auto') else 'mdi:hvac-off' }};
          --uix-icon-color: {{ 'var(--state-climate-auto-color)' if is_state('climate.hvac', 'auto') else 'var(--state-inactive-color)' }};
        }

assertions: []

