id: doc_spark_lock_for
description: "Doc image: Forge lock spark for (lock.md)"
view_path: doc-spark-lock-for

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631

card:
  type: entities
  grid_options:
    columns: 6
  entities:
    - type: custom:uix-forge
      forge:
        mold: row
        sparks:
          - type: lock
            for: $ hui-generic-entity-row
            duration: 5000
            locks:
              - code: 1234
                admins: true
      element:
        entity: light.bed_light

assertions: []

doc_animation:
  output: docs/source/assets/page-assets/forge/sparks/lock-for.gif
  root: hui-entities-card
  padding: 16 50 550 50
  interval_ms: 66
  threshold: 0.02
  cursor: pointer
  segments:
    - frames: 14   # ~1 s
    - interactions:
        - type: hover
          root: uix-forge
          selector: hui-toggle-entity-row
          settle_ms: 100
      frames: 7   # ~0.5 s
    - interactions:
        - type: click
          root: uix-forge
          selector: hui-toggle-entity-row
          settle_ms: 50
      frames: 3   # ~0.2 s
      click_circle: true
    - frames: 14   # ~1 s
    - interactions:
        - type: click
          root: wa-input
          selector: "#input"
          settle_ms: 50
      frames: 3   # ~0.2 s
    - interactions:
        - type: hover_away
      frames: 7   # ~0.5 s
    - interactions:
        - type: input_text
          root: wa-input
          selector: "#input"
          text: "1234"
          settle_ms: 50
      frames: 14  # ~1 s
    - interactions:
        - type: hover
          root: dialog-enter-code
          selector: ha-control-button.submit
          settle_ms: 100
      frames: 7   # ~0.5 s
    - interactions:
        - type: click
          root: dialog-enter-code
          selector: ha-control-button.submit
          settle_ms: 50
      click_circle: true
      frames: 3   # ~0.2 s
    - interactions:
        - type: hover_away
      frames: 32  # ~3 s
    