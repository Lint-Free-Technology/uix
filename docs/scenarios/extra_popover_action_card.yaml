id: doc_extra_popover_action_card
description: "UIX popover action with card on a button"
view_path: doc-extra-popover-action

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 181
      color_temp_kelvin: 2631

card:
  type: button
  show_icon: false
  name: Popover
  tap_action:
    action: fire-dom-event
    uix:
      action: popover
      data:
        title: Bed light
        subtitle: Quick controls
        subtitle_position: above
        width: small
        card:
          type: entities
          entities:
            - light.bed_light
        uix:
          style: |
            .uix-popover-card {
              --ha-card-border-width: 0px;
              --ha-card-background: none;
            }
  
doc_animation:
  output: docs/source/assets/page-assets/extras/extra-popover-action-card.gif
  root: hui-button-card
  padding: 16 150 250 150
  interval_ms: 66
  threshold: 0.02
  cursor: pointer
  segments:
    - frames: 7   # ~0.5 s
    - interactions:
        - type: hover
          root: hui-button-card
          selector: ha-card
          settle_ms: 0
      frames: 14   # ~1 s
    - interactions:
        - type: click
          root: hui-button-card
          selector: ha-card
          settle_ms: 0
      frames: 3   # ~0.2 s
      click_circle: true
    - interactions:
        - type: hover_away
    - frames: 50   # ~3 s
