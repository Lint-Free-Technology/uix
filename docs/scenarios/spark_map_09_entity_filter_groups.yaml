id: doc_forge_map_spark_entity_filter_groups
description: "Doc image: UIX Forge map spark with entity filter with groups (map.md)"
view_path: doc-forge-map-spark-entity-filter-groups

setup:
  - type: webhook
    webhook_id: uix_device_tracker_phone
    payload:
      latitude: 51.752985
      longitude: -1.257988
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_tablet
    payload:
      latitude: 51.752985
      longitude: -1.257988
      resolution: 1

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: map
        entity_filter:
          group:
            persons: Household
            trackers: Phones
            zones: Places
  element:
    type: map
    entities:
      - zone.london
      - device_tracker.phone
      - device_tracker.tablet

interactions:
  - type: click
    root: ha-map
    selector: div.uix-map-entity-filter-control
    settle_ms: 500
  - type: hover
    root: ha-map
    selector: ha-dropdown-item[data-group-trigger="trackers"]
    settle_ms: 500

assertions: []

doc_image:
  output: docs/source/assets/page-assets/forge/sparks/map-entity-filter-groups.png
  root: uix-forge
  padding: 16 135 90 16
  threshold: 0.02