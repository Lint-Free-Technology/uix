id: doc_spark_badge_offsets
description: "Doc image: Forge Badge spark with offsets (badge.md)"
view_path: doc-spark-badge-offsets

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: badge
        after: hui-tile-card $ ha-tile-icon
        content: 3
        variant: danger
        pill: true
        style:
          "--uix-badge-offset-x": -2px
          "--uix-badge-offset-y": -2px
  element:
    type: tile
    entity: light.bed_light

assertions: []

doc_image:
  output: docs/source/assets/page-assets/forge/sparks/badge-offsets.png
  root: hui-tile-card
  padding: 16