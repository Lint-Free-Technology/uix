id: doc_forge_map_spark_tour_pois
description: "Doc image: UIX Forge map spark tour with pois (map.md)"
view_path: doc-forge-map-spark-tour-pois

setup:
  - type: webhook
    webhook_id: uix_device_tracker_phone
    payload:
      latitude: 51.5074
      longitude: -0.1278
      resolution: 1
  - type: webhook
    webhook_id: uix_device_tracker_tablet
    payload:
      latitude: 51.752985
      longitude: -1.257988
      resolution: 1

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: map
        tour:
          period: 10s
          icon_pause: mdi:pause-circle
          icon_play: mdi:play-circle
          icon_position:
            bottom: 16px
            left: 16px
          poi:
            - latitude: 51.614387 
              longitude: -0.731585
              zoom: 8
            - entity: device_tracker.tablet
              zoom: 14
  element:
    type: map
    entities:
      - device_tracker.phone
      - device_tracker.tablet

assertions: []

doc_animation:
  output: docs/source/assets/page-assets/forge/sparks/map-tour-pois.mp4
  root: uix-forge
  padding: 16
  interval_ms: 66
  threshold: 1
  segments:
    - frames:  380  # ~20 s