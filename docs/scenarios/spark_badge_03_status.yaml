id: doc_spark_badge_status
description: "Doc image: Forge Badge spark with status (badge.md)"
view_path: doc-spark-badge-status

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631

card:
  type: custom:uix-forge
  forge:
    mold: card
    sparks:
      - type: badge
        after: hui-tile-card $ ha-tile-info
        content: Experimental
        variant: warning
        appearance: outlined
        start_icon: mdi:flask-outline
  element:
    type: tile
    entity: light.bed_light
    uix:
      style: |
        ha-tile-info {
          flex: 1;
        }

assertions: []

doc_image:
  output: docs/source/assets/page-assets/forge/sparks/badge-status.png
  root: hui-tile-card
  padding: 16